<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyAssist - Python Expert</title>
    <link rel="stylesheet" href="/common-static/base.css">
    <link rel="stylesheet" href="/common-static/components.css">
    <link rel="stylesheet" href="/static/all.css">
</head>
<body>

<!-- HEADER (Topbar) -->
<header>
    <div class="brand">
        <button id="toggle-sidebar" type="button" onclick="toggleSidebar()" title="Toggle chat history" aria-label="Toggle chat history">&#9776;</button>
        <a href="/" class="back-link">PyAssist</a>
    </div>
    
    <div id="user-info">
        <span id="welcome-text">Python Expert</span>
        <div id="conn-status" class="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </div>
</header>

<!-- TABS -->
<div class="tabs" role="tablist" aria-label="PyAssist views">
    <button type="button" class="tab active" id="tab-chat" data-tab="chat" role="tab" aria-selected="true" aria-controls="chat-view" onclick="switchTab('chat')">Chat</button>
    <button type="button" class="tab" id="tab-upload" data-tab="upload" role="tab" aria-selected="false" aria-controls="upload-view" onclick="switchTab('upload')">Upload Files</button>
</div>

<!-- CHAT VIEW -->
<div class="view active" id="chat-view" role="tabpanel" aria-labelledby="tab-chat">
    <div class="chat-layout">

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="btn btn--primary btn--block btn--sm" onclick="newChat()">+ New Chat</button>
            </div>
            <div class="sidebar-list" id="session-list">
                <div class="sidebar-empty">No past sessions</div>
            </div>
        </div>

        <!-- CHAT MAIN -->
        <div id="chat-main">
            <div id="messages">
                <div class="message assistant">
                    <div class="avatar">AI</div>
                    <div class="bubble-wrapper">
                        <div class="bubble">Hello! I'm PyAssist, your Python expert. Ask me about Python, code reviews, best practices, or upload files for analysis.</div>
                    </div>
                </div>
            </div>

            <!-- INPUT AREA -->
            <div class="input-area">
                <div class="input-wrapper">
                    <!-- Upload Button -->
                    <button class="upload-icon-btn" id="upload-btn" title="Attach files" onclick="document.getElementById('file-input').click()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 3v12m0 0l-3-3m3 3l3-3M5 21h14"/>
                        </svg>
                    </button>

                    <!-- Textarea -->
                    <textarea id="chat-input" class="input" placeholder="Ask about Python, code reviews, or paste code..." rows="1" onkeydown="handleKeyPress(event)" oninput="autoResizeTextarea(this)"></textarea>

                    <!-- Send Button -->
                    <button id="send-btn" class="btn btn--primary" aria-label="Send message" onclick="sendMessage()">Send</button>
                </div>

                <!-- Attachments Area -->
                <div id="attachments-area" class="attachments-area"></div>
            </div>
        </div>

    </div>
</div>

<!-- UPLOAD VIEW -->
<div class="view" id="upload-view" role="tabpanel" aria-labelledby="tab-upload" aria-hidden="true" hidden>
    <div id="upload-view-inner">
        <div class="docs-header">
            <h2>Upload Documents</h2>
            <div class="docs-actions">
                <input type="file" id="upload-file-input" multiple accept=".py,.txt,.md,.json,.yaml,.yml" style="display:none">
                <button class="btn btn--secondary btn--sm docs-action-btn" id="upload-tab-upload-btn" onclick="document.getElementById('upload-file-input').click()">Upload</button>
                <button class="btn btn--secondary btn--sm docs-action-btn" onclick="loadDocuments()">Refresh</button>
            </div>
        </div>

        <div id="upload-tab-count-bar"></div>

        <div id="upload-tab-sort-bar" class="sort-bar sort-bar--split">
            <input type="search" id="upload-tab-doc-search" class="input toolbar-search" placeholder="Search filename..." oninput="renderUploadDocs()">
            <select class="input sort-select" id="upload-sort-select" onchange="setUploadSort(this.value)">
                <option value="latest">Latest</option>
                <option value="name-asc">Name (A→Z)</option>
                <option value="name-desc">Name (Z→A)</option>
            </select>
            <div class="toolbar-right">
                <button class="btn btn--primary btn--sm docs-action-btn" id="upload-tab-save-all-btn" onclick="saveAllUpload()">Save All</button>
            </div>
        </div>

        <table class="table docs-table">
            <colgroup>
                <col style="width:5%">
                <col style="width:40%">
                <col style="width:15%">
                <col style="width:20%">
                <col style="width:20%">
            </colgroup>
            <thead>
                <tr>
                    <th class="cb-col"><input type="checkbox" id="upload-select-all-cb" onchange="toggleUploadSelectAll(this)" title="Select all"></th>
                    <th>Filename</th>
                    <th>Size</th>
                    <th>Uploaded</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="upload-tab-docs-tbody">
                <tr>
                    <td colspan="5" class="empty-state">
                        <div class="loading-state">
                            <span class="spinner" aria-hidden="true"></span>
                            <span>Loading...</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Hidden file inputs -->
<input type="file" id="file-input" multiple accept=".py,.txt,.md,.json,.yaml,.yml" style="display: none;">

<!-- Scripts -->
<script src="/static/all.js"></script>
</body>
</html>
